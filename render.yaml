services:
  - type: web
    name: deadlock-stat-tracker-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DEADLOCK_API_BASE_URL
        value: https://api.deadlock-api.com
      - key: DEADLOCK_API_KEY
        sync: false
      - key: ORIGIN
        sync: false
